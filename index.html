<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Person Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            text-align: center;
        }

        .container {
            padding-top: 120px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #cbd5e1;
        }

        .card {
            margin: 40px auto;
            width: 300px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #38bdf8;
            color: black;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn:hover {
            background: #0ea5e9;
        }

        footer {
            margin-top: 80px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>LT person Page</h1>
        <p>欢迎来到我的个人主页 / GitHub Pages</p>

        <div class="card">
            <h2>关于我</h2>
            <p>龙腾 研0 记录中</p>

            <a class="btn" href="https://github.com/" target="_blank">
                查看我的GitHub
            </a>
        </div>

        <footer>
            © 2026 Person Page | Powered by GitHub Pages
        </footer>
    </div>

</body>
</html>
