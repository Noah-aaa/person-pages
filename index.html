<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="LongTeng Personal Homepage, Software Engineering, Computer Technology, Study Notes, Achievements and Personal Blog.">

    <meta name="keywords"
        content="LongTeng, Software Engineering, Computer Technology, Blog, Study Notes, Personal Homepage">

    <meta name="author" content="LongTeng">
    <title>龙腾个人主页</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/moment.js"></script>


</head>

<body>

    <!-- 语言切换 -->
    <div class="lang-switch" onclick="toggleLang()">
        <span id="lang-text">EN</span>
    </div>

    <!-- ===== 头部 ===== -->
    <header class="hero">
        <h1  class="ignore">龙腾(LongTeng)</h1>

        <p>
            本科：软件工程 ｜ 研究生：计算机技术 ｜ 研0记录中
        </p>

        <div id="datetime"></div>
    </header>

    <!-- ===== 主体 ===== -->
    <main class="container">

        <section>
            <h2>
                <a href="achievement.html" target="_blank">
                    🏆 我的成就
                </a>
            </h2>

            <iframe src="achievement.html"></iframe>
        </section>

        <section>
            <h2>
                <a href="rant.html" target="_blank">
                    💭 吐槽专区
                </a>
            </h2>

            <iframe src="rant.html"></iframe>
        </section>

        <section>
            <h2>
                <a href="study.html" target="_blank">
                    📚 学习心得
                </a>
            </h2>

            <iframe src="study.html"></iframe>
        </section>

    </main>

    <!-- ===== 页脚 ===== -->
    <footer class="ignore">
        © 2026 龙腾(LongTeng) | Powered by GitHub Pages
    </footer>

    <!-- ===== 时间 ===== -->
    <script>
        function updateDateTime() {
            const now = moment().format('YYYY-MM-DD HH:mm:ss');
            document.getElementById('datetime').innerHTML = now;
        }

        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>

    <!-- ===== translate.js ===== -->
    <script src="https://res.zvo.cn/translate/translate.js"></script>

    <script>

        // 读取上次语言状态
        let currentLang =
            localStorage.getItem("lang") === "en"
                ? "en"
                : "zh";

        // 初始化翻译
        if (currentLang === "en") {
            translate.to = "english";
        }

        translate.execute();

        // 隐藏默认翻译下拉框
        setTimeout(() => {

            document.querySelectorAll(
                "#translate,.translateSelectLanguage,.languageSelect,.languageSelectBox,.translateBox"
            ).forEach(el => {
                if (el) el.remove();
            });

        }, 1000);

        // 初始化按钮文字
        document.getElementById("lang-text").innerText =
            currentLang === "en"
                ? "中文"
                : "EN";

        // 切换语言
        function toggleLang() {

            const text = document.getElementById("lang-text");

            if (currentLang === "zh") {

                localStorage.setItem("lang", "en");
                localStorage.setItem("to", "english");

                translate.to = "english";
                translate.execute();

                currentLang = "en";

                text.innerText = "中文";

            } else {

                localStorage.removeItem("lang");
                localStorage.removeItem("to");

                sessionStorage.clear();

                location.reload();
                return;
            }

            // 重新加载iframe
            document.querySelectorAll("iframe").forEach(frame => {
                frame.src = frame.src;
            });
        }


    </script>

</body>

</html>
